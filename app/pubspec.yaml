name: dragon_dice_app
description: >-
  Dragon Dice on the desktop: roll real dice, watch their entropy reach the
  target, and get the SHA-512 digest and its BIP39 mnemonic.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dragon_dice_ui:
    path: ../ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
